# monitor1's port 80: the ACME HTTP-01 challenge, which acme.sh writes under
# /var/www/acme when it issues or renews the certificate (README, "The
# monitor server"); everything else is sent to https. Installed as
# /etc/nginx/sites-available/monitor-acme and linked into sites-enabled by
# scripts/install-system-files.sh, on both of its passes.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name monitor.anocloud.com;
    server_tokens off;
    access_log /var/log/nginx/monitor-access.log;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://monitor.anocloud.com$request_uri;
    }
}
