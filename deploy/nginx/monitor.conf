# monitor1's nginx site: TLS for monitor.anocloud.com, ended here with the
# certificate at /etc/monitor/tls, everything handed to the monitor's server
# on loopback. No balancer stands in front. Installed as
# /etc/nginx/sites-available/monitor and linked into sites-enabled by
# scripts/install-system-files.sh once the certificate exists.
#
# The port duplicates PORT in network/monitor.env on purpose: nginx reads no
# env file. Change it in both places.
#
# The page's safety headers are set by the server itself (server/app.js), so
# the page runs under the same headers on a development machine. Only
# Strict-Transport-Security is added here, where TLS is.
#
# /api/ is limited to five requests a second for each address, with a burst
# of 20: the passkey routes are open to anyone. The page itself asks once
# every 15 seconds.

limit_req_zone $binary_remote_addr zone=monitor_api:1m rate=5r/s;

# Any other name, or none: the handshake needs a certificate, then the
# connection is closed without an answer.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/monitor/tls/fullchain.pem;
    ssl_certificate_key /etc/monitor/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.anocloud.com;
    server_tokens off;
    ssl_certificate /etc/monitor/tls/fullchain.pem;
    ssl_certificate_key /etc/monitor/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript;
    access_log /var/log/nginx/monitor-access.log;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        limit_req zone=monitor_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
